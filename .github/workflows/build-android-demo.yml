name: Build Android Demo APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/**'
      - 'server/**'
      - 'vite.config.js'
      - 'render.yaml'
      - '.env.example'
      - 'src/**'
      - 'scripts/test-rea-companion-contract.mjs'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-demo.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check website scripts and manifest
        run: |
          node --check server/server.js
          node --check server/vault-store.js
          node --check server/login.js
          node --check public/sw.js
          node --check src/workshop-data.js
          node --check src/skill-library.js
          node --check src/local-coder-api.js
          node --check src/device-local-coder.js
          node --check src/rea-companion-contract.js
          node --check src/shared-vault-context.js
          node --check server/workshop-smoke-test.js
          node --check scripts/test-ai-team.mjs
          node --check scripts/test-rea-companion-contract.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('public/manifest.webmanifest','utf8'))"
      - name: Build web assets
        run: npm run build
      - name: Test Local Coder and reuse workspace
        run: npm run test:workshop
      - name: Test Skill Library
        run: |
          npm run test:skills
          npm run test:api-local-coder
          npm run test:ai-team
      - name: Test device Local Coder bridge
        run: npm run test:device-local-coder
      - name: Test optional REA Companion contract (mock only)
        run: npm run test:rea-companion-contract
      - name: Test private website login gate
        run: npm run test:site
      - name: Create Android project
        run: npx cap add android
      - name: Prepare a smaller Gradle distribution
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if not path.is_file():
              raise SystemExit("Generated Gradle wrapper properties were not found.")
          lines = path.read_text().splitlines()
          distribution_index = next(
              (index for index, line in enumerate(lines) if line.startswith("distributionUrl=")),
              -1
          )
          if distribution_index < 0:
              raise SystemExit("Gradle distribution URL was not found.")
          url = lines[distribution_index].split("=", 1)[1].replace("\\:", ":")
          match = re.fullmatch(r"https://services\\.gradle\\.org/distributions/gradle-([0-9.]+)-(?:all|bin)\\.zip", url)
          if not match:
              raise SystemExit("Unexpected generated Gradle distribution URL.")
          version = match.group(1)
          if version != "8.11.1":
              raise SystemExit(f"Unreviewed Gradle version: {version}")
          # Use the listed mirror, but require Gradle's official release checksum
          # before the downloaded distribution can be used by the wrapper.
          url = f"https://mirrors.aliyun.com/gradle/distributions/v{version}/gradle-{version}-bin.zip"
          properties = {
              "distributionUrl": url.replace(":", "\\:"),
              "distributionSha256Sum": "f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6",
              "networkTimeout": "120000",
          }
          for key, value in properties.items():
              indexes = [index for index, line in enumerate(lines) if line.startswith(key + "=")]
              if indexes:
                  lines[indexes[0]] = key + "=" + value
                  for index in reversed(indexes[1:]):
                      del lines[index]
              else:
                  lines.append(key + "=" + value)
          path.write_text("\n".join(lines) + "\n")
          print("Gradle wrapper:", url, "| official SHA-256 pinned | networkTimeout=120000ms")
          PY
      - name: Allow local Ollama HTTP on trusted networks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android:usesCleartextTraffic=" not in s:
              s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          PY
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-Demo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
