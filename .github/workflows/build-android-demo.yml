name: Build Android Demo APK

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'public/**'
      - 'server/**'
      - 'vite.config.js'
      - 'render.yaml'
      - '.env.example'
      - 'src/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-android-demo.yml'
      - 'README.md'

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check website scripts and manifest
        run: |
          node --check server/server.js
          node --check server/vault-store.js
          node --check server/login.js
          node --check public/sw.js
          node --check src/workshop-data.js
          node --check src/shared-vault-context.js
          node --check server/workshop-smoke-test.js
          node -e "JSON.parse(require('node:fs').readFileSync('public/manifest.webmanifest','utf8'))"
      - name: Build web assets
        run: npm run build
      - name: Test Local Coder and reuse workspace
        run: npm run test:workshop
      - name: Test private website login gate
        run: npm run test:site
      - name: Create Android project
        run: npx cap add android
      - name: Allow local Ollama HTTP on trusted networks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if "android:usesCleartextTraffic=" not in s:
              s = s.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          PY
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Studio-Alpha-1-Demo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
