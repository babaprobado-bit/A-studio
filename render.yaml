services:
  - type: web
    name: ai-studio-alpha-1-private
    runtime: node
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: VAULT_ENCRYPTION_KEY
        generateValue: true
      - key: VAULT_DATABASE_URL
        sync: false
      - key: VAULT_DATA_DIR
        value: /var/data
      # Preferred: set VAULT_DATABASE_URL to a managed PostgreSQL connection string with SSL enabled.
      # Database payloads remain AES-256-GCM encrypted before they leave the application.
      # File fallback needs a persistent disk mounted at /var/data; local/ephemeral disk is not durable.
