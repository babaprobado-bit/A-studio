services:
  - type: web
    name: ai-studio-alpha-1-private
    runtime: node
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: VAULT_ENCRYPTION_KEY
        generateValue: true
      - key: VAULT_DATA_DIR
        value: /var/data
      # For durable records on Render, attach a paid persistent disk at /var/data.
      # Free web services cannot use persistent disks, so configure persistent storage before relying on long-term saves.
