<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>AI Studio — Güvenli giriş</title>
  <link rel="stylesheet" href="/login.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="login-wrap">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-mark" aria-hidden="true">✳</div>
      <p class="eyebrow">AI STUDIO ALPHA 1</p>
      <h1 id="login-title">Özel çalışma alanın</h1>
      <p class="intro">Devam etmek için sitenin parolasını gir.</p>
      <form id="loginForm">
        <label for="sitePassword">Site parolası</label>
        <input id="sitePassword" name="password" type="password" required minlength="12" maxlength="256" autocomplete="current-password" autocapitalize="off" spellcheck="false">
        <button id="loginButton" type="submit">Güvenli giriş ↗</button>
        <p id="loginError" role="alert" aria-live="polite"></p>
      </form>
      <p class="footnote">Bu site tek bir paylaşılan parolayla korunur. Parolayı kimseyle paylaşma; giriş 8 saat sonra sona erer.</p>
    </section>
  </main>
</body>
</html>
